[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cti-claim-provenance"
version = "0.1.0"
description = "Point-in-time CTI claim-provenance benchmark contracts and evaluator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.12,<3",
  "pypdf>=6.1,<7",
  "pyyaml>=6.0,<7",
]

[project.scripts]
cti-provenance = "cti_provenance.cli:main"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cti_provenance"]

[tool.hatch.build]
exclude = [
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/dist",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cti_provenance"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not legacy'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "legacy: historical compatibility checks excluded from the active release gate",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
