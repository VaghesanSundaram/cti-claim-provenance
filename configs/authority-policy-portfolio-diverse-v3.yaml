version: authority-policy-portfolio-diverse-v3
status: manager_audit_candidate
rules:
  - predicate: source.temporal_change
    requirement: Every named earlier and later official state is required.
    conflict_action: Preserve each publisher state and report the exact delta.
  - predicate: source.authority_divergence
    requirement: Attribute each claim only to the authority governing that predicate.
    conflict_action: Never blend vendor, NVD, CISA KEV, or coordinator authority.
  - predicate: source.multi_source_synthesis
    requirement: Every independently sourced necessary span is required.
    conflict_action: Abstain if any required predicate lacks eligible authoritative support.
temporal_boundary: >-
  Publisher-declared version evidence establishes what the named version says and
  its declared time; it does not prove independently observed historical availability.
